<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAHOOD | فهد ستور</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* الهيدر */
        header {
            background-color: #000000;
            padding: 15px 25px;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #d4af37;
            text-decoration: none;
        }
        /* الهيرو */
        .hero {
            position: relative;
            height: 70vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.85)), #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hero-title {
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .hero-desc {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 25px;
        }
        .btn-shop {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-shop:hover {
            background-color: #fff;
        }
        /* الأقسام والمنتجات */
        .section-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 15px;
        }
        .section-title {
            text-align: center;
            font-size: 26px;
            margin-bottom: 25px;
            color: #fff;
            letter-spacing: 1px;
        }
        .categories-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .cat-btn {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #d4af37;
            color: #000;
            font-weight: bold;
            border-color: #d4af37;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }
        .product-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            background: #222;
        }
        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .product-info h3 {
            font-size: 15px;
            margin-bottom: 8px;
            color: #fff;
        }
        .price {
            font-size: 17px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-order {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-order:hover {
            background: #d4af37;
        }
        /* المودال (نافذة الطلب) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: #141414;
            color: #fff;
            border: 1px solid #333;
            width: 100%;
            max-width: 480px;
            border-radius: 14px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 26px;
            cursor: pointer;
            color: #aaa;
        }
        .close-btn:hover { color: #fff; }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #bbb;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <a href="#" class="logo">FAHOOD</a>
        <div style="font-size: 13px; color: #aaa;" id="visitorCounter">الزوار: <span style="color:#d4af37">...</span></div>
    </header>

    <!-- الهيرو -->
    <section class="hero">
        <h1 class="hero-title">فهد ستور | FAHOOD</h1>
        <p class="hero-desc">أرقى الساعات، العطور، والأكسسوارات العصرية بتصميم فخم يناسب ذوقك الرفيع.</p>
        <button class="btn-shop" onclick="scrollToProducts()">تسوّق الآن</button>
    </section>

    <!-- المنتجات والأقسام -->
    <section class="section-container" id="products">
        <h2 class="section-title">أحدث المنتجات</h2>
        
        <div class="categories-bar">
            <button onclick="filterCategory('الكل')" class="cat-btn active">الكل</button>
            <button onclick="filterCategory('رجال')" class="cat-btn">رجال</button>
            <button onclick="filterCategory('نساء')" class="cat-btn">نساء</button>
            <button onclick="filterCategory('إكسسوارات رجال')" class="cat-btn">إكسسوارات رجال</button>
            <button onclick="filterCategory('إكسسوارات نساء')" class="cat-btn">إكسسوارات نساء</button>
        </div>

        <div class="products-grid" id="storeProducts"></div>
    </section>

    <!-- نافذة تفاصيل المنتج والطلب -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // عداد الزيارات
        let visitors = localStorage.getItem('fahood_visitors') ? parseInt(localStorage.getItem('fahood_visitors')) : 120;
        visitors++;
        localStorage.setItem('fahood_visitors', visitors);
        document.getElementById('visitorCounter').innerHTML = `الزوار: <span style="color:#d4af37">${visitors}</span>`;

        function scrollToProducts() {
            document.getElementById('products').scrollIntoView({ behavior: 'smooth' });
        }

        let currentSelectedCategory = 'الكل';

        function loadStoreProducts(category = 'الكل') {
            currentSelectedCategory = category;
            const products = JSON.parse(localStorage.getItem('fahood_products')) || [];
            const grid = document.getElementById('storeProducts');
            if (!grid) return;
            
            grid.innerHTML = '';

            const filtered = category === 'الكل' ? products : products.filter(p => p.category === category);

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #777;">لا توجد منتجات متوفرة في هذا القسم حالياً.</div>';
                return;
            }

            filtered.forEach((product) => {
                let mainImage = product.images && product.images.length > 0 ? product.images[0] : product.image;
                
                grid.innerHTML += `
                    <div class="product-card" onclick="openProductDetails('${product.name.replace(/'/g, "\\'")}')">
                        <img src="${mainImage}" alt="${product.name}">
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <div class="price">${product.price} ج.م</div>
                            <button class="btn-order">اطلب الآن</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.trim() === cat) {
                    btn.classList.add('active');
                }
            });
            loadStoreProducts(cat);
        }

        let appliedDiscountRate = 0;

        function openProductDetails(productName) {
            const products = JSON.parse(localStorage.getItem('fahood_products')) || [];
            const product = products.find(p => p.name === productName);
            if (!product) return;

            appliedDiscountRate = 0;
            let imagesList = product.images && product.images.length > 0 ? product.images : [product.image];
            let colorsList = product.colors ? product.colors.split(',').map(c => c.trim()) : ['الأساسي'];

            const modal = document.getElementById('orderModal');
            const content = document.getElementById('modalContent');
            if (!modal || !content) return;

            content.innerHTML = `
                <h2 style="color: #d4af37; margin-bottom: 12px; font-size: 20px;">${product.name}</h2>
                
                <!-- صور المنتج -->
                <div style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px;">
                    ${imagesList.map(img => `<img src="${img}" style="width: 75px; height: 75px; object-fit: cover; border-radius: 8px; border: 1px solid #444; flex-shrink: 0;">`).join('')}
                </div>

                <!-- الألوان -->
                <div class="form-group">
                    <label>اللون / الشكل:</label>
                    <select id="selectedColor">
                        ${colorsList.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                </div>

                <!-- الكمية -->
                <div class="form-group">
                    <label>الكمية:</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button type="button" onclick="changeQty(-1, ${product.price})" style="width: 38px; height: 38px; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 18px; cursor: pointer;">-</button>
                        <input type="number" id="orderQty" value="1" min="1" readonly style="text-align: center; font-weight: bold; width: 60px;">
                        <button type="button" onclick="changeQty(1, ${product.price})" style="width: 38px; height: 38px; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 18px; cursor: pointer;">+</button>
                    </div>
                </div>

                <!-- كود الخصم -->
                <div class="form-group">
                    <label>كود الخصم:</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="discountCodeInput" placeholder="أدخل الكود (مثال: FAHOOD10)">
                        <button type="button" onclick="applyDiscount(${product.price})" style="background: #d4af37; color: #000; border: none; padding: 0 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">تطبيق</button>
                    </div>
                    <span id="discountMsg" style="font-size: 12px; margin-top: 4px; display: block;"></span>
                </div>

                <!-- الإجمالي -->
                <div style="background: #111; padding: 12px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px; font-size: 16px;">
                    الإجمالي النهائي: <span id="finalTotalPrice" style="color: #d4af37; font-weight: bold;">${product.price}</span> ج.م
                </div>

                <!-- طريقة الدفع -->
                <div class="form-group">
                    <label>طريقة الدفع:</label>
                    <div style="background: #111; padding: 10px; border-radius: 6px; border: 1px solid #333; font-size: 13px; line-height: 1.8;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 5px;">
                            <input type="radio" name="paymentMethod" value="فودافون كاش" checked style="width: auto;"> 
                            فودافون كاش (تحويل على: <span style="color: #d4af37; font-weight: bold;">01014189013</span>)
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 5px;">
                            <input type="radio" name="paymentMethod" value="إنستاباي" style="width: auto;"> 
                            إنستاباي (InstaPay)
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="paymentMethod" value="الدفع عند الاستلام" style="width: auto;"> 
                            الدفع عند الاستلام
                        </label>
                    </div>
                </div>

                <!-- صورة إيصال التحويل -->
                <div class="form-group">
                    <label>صورة إيصال التحويل (إن وجد):</label>
                    <input type="file" id="transferScreenshot" accept="image/*" style="padding: 6px;">
                </div>

                <!-- بيانات العميل -->
                <div class="form-group"><input type="text" id="buyerName" placeholder="الاسم بالكامل"></div>
                <div class="form-group"><input type="text" id="buyerAddress" placeholder="العنوان بالتفصيل (المحافظة - المدينة - الشارع)"></div>
                <div class="form-group"><input type="tel" id="buyerPhone" placeholder="رقم الهاتف"></div>
                <div class="form-group"><input type="tel" id="buyerWhatsapp" placeholder="رقم الواتساب"></div>

                <button type="button" onclick="submitOrder('${product.name.replace(/'/g, "\\'")}')" class="btn-order" style="background: #25d366; color: #fff; padding: 12px; font-size: 16px; margin-top: 5px;">تأكيد الطلب الآن</button>
            `;
            modal.style.display = 'flex';
        }

        function changeQty(delta, basePrice) {
            const qtyInput = document.getElementById('orderQty');
            if (!qtyInput) return;
            let current = parseInt(qtyInput.value) || 1;
            current += delta;
            if (current < 1) current = 1;
            qtyInput.value = current;
            calculateTotal(basePrice);
        }

        function applyDiscount(basePrice) {
            const code = document.getElementById('discountCodeInput').value.trim().toUpperCase();
            const msg = document.getElementById('discountMsg');
            if (code === 'FAHOOD10' || code === 'فهد10') {
                appliedDiscountRate = 0.10;
                msg.textContent = 'تم تطبيق خصم 10% بنجاح!';
                msg.style.color = '#25d366';
            } else if (code === 'FAHOOD20') {
                appliedDiscountRate = 0.20;
                msg.textContent = 'تم تطبيق خصم 20% بنجاح!';
                msg.style.color = '#25d366';
            } else {
                appliedDiscountRate = 0;
                msg.textContent = 'كود الخصم غير صحيح!';
                msg.style.color = '#ff4d4d';
            }
            calculateTotal(basePrice);
        }

        function calculateTotal(basePrice) {
            const qty = parseInt(document.getElementById('orderQty').value) || 1;
            let total = basePrice * qty;
            if (appliedDiscountRate > 0) {
                total = total - (total * appliedDiscountRate);
            }
            document.getElementById('finalTotalPrice').textContent = total.toFixed(0);
        }

        function submitOrder(productName) {
            const name = document.getElementById('buyerName').value.trim();
            const address = document.getElementById('buyerAddress').value.trim();
            const phone = document.getElementById('buyerPhone').value.trim();
            const whatsapp = document.getElementById('buyerWhatsapp').value.trim();
            const color = document.getElementById('selectedColor').value;
            const qty = document.getElementById('orderQty').value;
            const totalPrice = document.getElementById('finalTotalPrice').textContent;
            const payment = document.querySelector('input[name="paymentMethod"]:checked').value;
            const fileInput = document.getElementById('transferScreenshot');

            if (!name || !address || !phone) {
                alert('من فضلك اكتب الاسم والعنوان ورقم الهاتف لتأكيد الطلب!');
                return;
            }

            const saveOrderData = (imgData = '') => {
                const orders = JSON.parse(localStorage.getItem('fahood_orders')) || [];
                orders.push({
                    product: productName,
                    color: color,
                    quantity: qty,
                    totalPrice: totalPrice,
                    paymentMethod: payment,
                    receiptImage: imgData,
                    name: name,
                    address: address,
                    whatsapp: whatsapp || phone,
                    phone: phone,
                    date: new Date().toLocaleString('ar-EG')
                });

                localStorage.setItem('fahood_orders', JSON.stringify(orders));
                alert('تم تأكيد طلبك بنجاح يا ' + name + '! سيظهر في لوحة التحكم فوراً.');
                closeModal();
            };

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveOrderData(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveOrderData('');
            }
        }

        function closeModal() {
            const modal = document.getElementById('orderModal');
            if (modal) modal.style.display = 'none';
        }

        // تشغيل المتجر عند التحميل
        loadStoreProducts('الكل');
    </script>
</body>
</html>
