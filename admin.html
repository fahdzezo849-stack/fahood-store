<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ولوحة تحكم FAHOOD</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 15px; }
        button { background: #000; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #333; }
        h1, h2, h3 { text-align: center; color: #333; }
        .stats-box { background: #000; color: #fff; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 20px; font-size: 15px; }
        .products-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; width: 200px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .buy-btn { background: #28a745; margin-top: 10px; }
        .buy-btn:hover { background: #218838; }
        .file-box { border: 2px dashed #ccc; padding: 12px; text-align: center; border-radius: 4px; background: #fafafa; cursor: pointer; margin: 8px 0; }
        .preview-img { max-width: 80px; max-height: 80px; display: block; margin: 5px auto; border-radius: 4px; }
        .order-item { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; margin-bottom: 10px; border-radius: 4px; font-size: 14px; }
        .admin-section { border-top: 2px solid #eee; margin-top: 30px; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>متجر FAHOOD</h1>

        <!-- عداد المشاهدات للزوار -->
        <div class="stats-box">
            👁️ إجمالي مشاهدات وزوار المتجر: <span id="viewCount">0</span>
        </div>

        <!-- قسم عرض المنتجات للعملاء -->
        <div id="storeSection">
            <h3>منتجاتنا المتاحة</h3>
            <div class="products-grid" id="storeProducts">
                <!-- المنتجات تظهر هنا تلقائياً -->
            </div>
        </div>

        <hr style="margin: 40px 0;">

        <!-- قسم لوحة التحكم (الدخول بكلمة المرور 123) -->
        <div class="admin-section">
            <div id="loginBox">
                <h3>دخول المشرف (الأدمن)</h3>
                <input type="password" id="adminPass" placeholder="اكتب كلمة المرور (123)">
                <button onclick="loginAdmin()">دخول للإدارة</button>
            </div>

            <div id="adminPanel" class="hidden">
                <h2>لوحة التحكم والإدارة</h2>
                
                <div style="background: #e9ecef; padding: 10px; text-align: center; border-radius: 4px; font-weight: bold; margin-bottom: 15px;">
                    📊 إجمالي المشاهدات المسجلة: <span id="adminViews">0</span>
                </div>

                <h3>إضافة منتج جديد</h3>
                <input type="text" id="prodName" placeholder="اسم المنتج">
                <input type="number" id="prodPrice" placeholder="السعر (بالجنيه)">
                <div class="file-box" onclick="document.getElementById('prodImageFile').click()">
                    <span id="fileText">اضغط لاختيار صورة المنتج من الجهاز</span>
                    <input type="file" id="prodImageFile" accept="image/*" style="display: none;" onchange="previewImage(this)">
                </div>
                <img id="imagePreview" class="preview-img hidden" alt="معاينة">
                <button onclick="addProduct()">حفظ ونشر المنتج في المتجر</button>

                <h3 style="margin-top: 30px;">📦 طلبات العملاء الواردة للبرنامج</h3>
                <div id="ordersContainer">
                    <p style="text-align: center; color: #666;">لا توجد طلبات حتى الآن.</p>
                </div>
                <button onclick="clearOrders()" style="background: #dc3545; margin-top: 10px;">مسح سجل الطلبات</button>
                <button onclick="logoutAdmin()" style="background: #6c757d; margin-top: 10px;">تسجيل الخروج من الأدمن</button>
            </div>
        </div>
    </div>

    <script>
        // حساب المشاهدات عند فتح الصفحة
        let views = localStorage.getItem('fahood_views') || 0;
        views++;
        localStorage.setItem('fahood_views', views);
        document.getElementById('viewCount').innerText = views;

        // عرض المنتجات في المتجر
        function loadStore() {
            const grid = document.getElementById('storeProducts');
            const products = JSON.parse(localStorage.getItem('fahood_products')) || [];
            
            if (products.length === 0) {
                grid.innerHTML = "<p style='color:#666;'>لا توجد منتجات مضافة حالياً.</p>";
                return;
            }

            grid.innerHTML = "";
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" alt="${p.name}">
                    <h4>${p.name}</h4>
                    <p style="color: #e44d26; font-weight: bold;">${p.price} جنيه</p>
                    <button class="buy-btn" onclick="orderProduct('${p.name}', '${p.price}')">طلب المنتج</button>
                `;
                grid.appendChild(card);
            });
        }

        // تسجيل الطلب مباشرة داخل الـ LocalStorage ليظهر في الأدمن
        function orderProduct(name, price) {
            const customerName = prompt("أدخل اسمك الكريم:");
            if (!customerName) return;
            const customerPhone = prompt("أدخل رقم هاتفك للتواصل:");
            if (!customerPhone) return;

            let orders = JSON.parse(localStorage.getItem('fahood_orders')) || [];
            orders.push({
                productName: name,
                price: price,
                customerName: customerName,
                customerPhone: customerPhone,
                date: new Date().toLocaleString('ar-EG')
            });

            localStorage.setItem('fahood_orders', JSON.stringify(orders));
            alert("✅ تم إرسال طلبك بنجاح وتسجيله في الإدارة!");
        }

        // وظائف الأدمن
        function loginAdmin() {
            if (document.getElementById('adminPass').value === "123") {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadAdminData();
            } else {
                alert("كلمة المرور خطأ! اكتب 123");
            }
        }

        function logoutAdmin() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('adminPass').value = '';
        }

        function loadAdminData() {
            document.getElementById('adminViews').innerText = localStorage.getItem('fahood_views') || 0;
            const container = document.getElementById('ordersContainer');
            const orders = JSON.parse(localStorage.getItem('fahood_orders')) || [];

            if (orders.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#666;'>لا توجد طلبات جديدة.</p>";
                return;
            }

            container.innerHTML = "";
            orders.slice().reverse().forEach(o => {
                const item = document.createElement('div');
                item.className = 'order-item';
                item.innerHTML = `
                    <strong>المنتج:</strong> ${o.productName} (${o.price} جنيه)<br>
                    <strong>العميل:</strong> ${o.customerName}<br>
                    <strong>الهاتف:</strong> <a href="tel:${o.customerPhone}">${o.customerPhone}</a><br>
                    <strong>الوقت:</strong> ${o.date}
                `;
                container.appendChild(item);
            });
        }

        let base64Img = "";
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('fileText').innerText = "تم اختيار: " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Img = e.target.result;
                    const prev = document.getElementById('imagePreview');
                    prev.src = base64Img;
                    prev.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            if (!name || !price || !base64Img) {
                alert("املأ الاسم والسعر واختار الصورة!");
                return;
            }

            let products = JSON.parse(localStorage.getItem('fahood_products')) || [];
            products.push({ name, price, image: base64Img });
            localStorage.setItem('fahood_products', JSON.stringify(products));

            alert("تم إضافة المنتج للمتجر بنجاح!");
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodImageFile').value = '';
            document.getElementById('fileText').innerText = 'اضغط لاختيار صورة المنتج من الجهاز';
            document.getElementById('imagePreview').classList.add('hidden');
            base64Img = "";
            loadStore();
        }

        function clearOrders() {
            if (confirm("هل تريد مسح كل الطلبات؟")) {
                localStorage.removeItem('fahood_orders');
                loadAdminData();
            }
        }

        loadStore();
    </script>
</body>
</html>
